[project]
name = "gradientdistillation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.8",
    "numpy>=2.2",
    "seaborn>=0.13.2",
    "typed-argument-parser>=1.10",
    "torch>=2.8.0",
    "torchvision>=0.23",
    "tqdm>=4.67.3",
    "wandb>=0.26.1",
    "torchmetrics>=1.9.0",
    "slurpp-lib",
    "diffusers>=0.27",
    "transformers",
    "omegaconf",
    "accelerate>=0.30",
    "clip @ git+https://github.com/openai/CLIP.git",
    "timm",
    "einops",
    "kmedoids",
    "scikit-learn",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
slurpp-lib = { path = "slurpp_lib", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]